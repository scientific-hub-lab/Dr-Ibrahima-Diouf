name: Mise à jour Google Scholar

on:
  schedule:
    - cron: "17 5 * * *"      # tous les jours à 05:17 UTC
  workflow_dispatch:           # bouton « Run workflow » dans l'onglet Actions
  push:
    paths:
      - update_scholar.py
      - .github/workflows/scholar.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lire les indicateurs Google Scholar
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python update_scholar.py
      - name: Publier si changement
        run: |
          if [ -n "$(git status --porcelain scholar.json)" ]; then
            git config user.name  "scholar-bot"
            git config user.email "actions@users.noreply.github.com"
            git add scholar.json
            git commit -m "Google Scholar : mise à jour des indicateurs"
            git push
          fi
